<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotated book excerpt</title>
  <meta name="description" content="A highlighted book-evidence excerpt.">
  <link rel="stylesheet" href="book-excerpt.css?v=whole-tables">
</head>
<body>
  <header class="viewer-header">
    <div class="viewer-heading">
      <p class="overline">Annotated book evidence · separate view</p>
      <h1 data-excerpt-title>The Symmetries of Things</h1>
      <p data-excerpt-context>Loading excerpt details…</p>
    </div>
    <nav class="viewer-actions" aria-label="Excerpt controls">
      <a data-return-link href="clockwork-coloring-correspondence.html">Return to correspondence</a>
      <button type="button" data-zoom-toggle aria-pressed="false">Actual size</button>
      <a data-excerpt-source href="https://books.google.com/books?id=EtQCk0TNafsC" target="_blank" rel="noopener">Open cited page at Google Books</a>
    </nav>
  </header>

  <main>
    <figure class="viewer-media" data-excerpt-media data-state="loading" data-zoom="fit">
      <img data-excerpt-image alt="" decoding="async">
      <figcaption data-excerpt-status role="status">Loading annotated excerpt…</figcaption>
    </figure>
  </main>

  <footer>
    <p>The outline marks the cited item.</p>
  </footer>

  <script type="module" src="book-excerpt.js?v=short-signature-audit-v2"></script>
</body>
</html>
